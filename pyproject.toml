[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delvedown"
version = "0.1.0"
description = "ターミナルで遊ぶ、文字で描くダンジョンのローグライク"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delvedown = "delvedown.__main__:main"

[project.urls]
Homepage = "https://github.com/takosasi-dev/delve-down"

[tool.setuptools]
packages = ["delvedown"]
