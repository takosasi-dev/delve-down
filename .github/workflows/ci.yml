name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 疑似端末(pty)で本物の curses 画面も動かす
      - name: テスト
        run: python tests/run_all.py

      - name: 画面なしで1回遊ばせる
        run: python -m delvedown --seed 1 --autoplay 3000
